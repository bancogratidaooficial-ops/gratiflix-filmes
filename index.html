<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX - NUVIX STYLE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f1115;color:#fff;font-family:Arial;padding-bottom:70px}
.top{position:fixed;top:0;width:100%;background:#0f1115;z-index:100;padding:10px 3%;display:flex;gap:10px;align-items:center}
.top input{flex:1;background:#1e2128;border:none;padding:12px 14px;border-radius:20px;color:#fff}
.ganhe{background:#1e2128;border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#f5c518;cursor:pointer}
.tabs{margin-top:58px;display:flex;gap:20px;padding:10px 3%;background:#0f1115;position:fixed;width:100%;z-index:90;overflow-x:auto}
.tabs span{color:#888;font-weight:800;white-space:nowrap;cursor:pointer}.tabs.ativo{color:#fff;border-bottom:3px solid #f5c518}
.admin{margin-top:102px;background:#000;padding:8px 2%;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid #222}
.admin button{border:none;padding:7px 8px;border-radius:6px;font-weight:900;font-size:8px;cursor:pointer}
.banner{height:320px;position:relative;background:#000;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;opacity:.6}
.banner-info{position:absolute;bottom:20px;left:3%;right:3%}
.banner-info h1{font-size:32px;font-family:serif;color:#e8c36a;text-shadow:0 2px 10px #000}
.btn-assistir{margin-top:12px;background:#000;border:1px solid #e8c36a;color:#fff;padding:12px 30px;border-radius:30px;font-weight:900}
.row-title{display:flex;justify-content:space-between;padding:16px 3% 8px;font-weight:800;font-size:16px}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 3% 10px}
.card{min-width:145px;max-width:145px;position:relative;border-radius:8px;overflow:hidden;background:#1a1d24}
.card img{width:100%;height:200px;object-fit:cover;cursor:pointer}
.card.tag{position:absolute;top:6px;right:6px;background:#1e90ff;font-size:8px;padding:2px 4px;border-radius:3px;font-weight:900}
.card.nota{position:absolute;bottom:28px;right:6px;color:#f5c518;font-weight:900;font-size:12px}
.card.titulo{padding:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.botoes{display:flex;background:#000}
.card.botoes span{flex:1;text-align:center;padding:6px 0;font-size:11px;cursor:pointer}
.bottom{position:fixed;bottom:0;width:100%;background:#15171d;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222;z-index:100}
.bottom div{text-align:center;color:#666;font-size:11px;cursor:pointer}.bottom.ativo{color:#f5c518}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none}#player iframe{width:100%;height:100%;border:none}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:10000;display:none;align-items:center;justify-content:center;padding:10px}
.box{background:#1e2128;border-radius:12px;padding:14px;width:100%;max-width:500px;border:1px solid #333;max-height:90vh;overflow:auto}
.box input,.box textarea{width:100%;padding:10px;border-radius:8px;border:none;background:#0f1115;color:#fff;margin-bottom:6px}textarea{height:100px}
</style>
</head>
<body>
<div class="top">
<input id="busca" placeholder="🔍 homem aranha" oninput="filtrar()">
<div class="ganhe" onclick="convidar()">🪙 Ganhe<br>Dinheiro</div>
</div>
<div class="tabs">
<span class="ativo" onclick="filtrarCategoria('')">Início</span>
<span onclick="filtrarCategoria('Séries')">Séries</span>
<span onclick="filtrarCategoria('Filme')">Filme</span>
<span onclick="filtrarCategoria('Anime')">Anime</span>
<span onclick="abrirGanhos()">💰 Indicar</span>
</div>

<div class="admin">
<button style="background:#00c851;color:#fff" onclick="addYT()">+ LINK YT</button>
<button style="background:#007feb;color:#fff" onclick="addPasta()">+ PASTA</button>
<button style="background:#ffcc00;color:#000" onclick="abrirArquivo()">📁 ARQUIVO</button>
<button style="background:#ff8c00;color:#fff" onclick="salvarFixo()">💾 FIXO</button>
<button style="background:#ff006a;color:#fff" onclick="compartilharSite()">📤 COMPARTILHAR SITE</button>
<button style="background:#222;color:#fff" onclick="localStorage.clear();location.reload()">↻ LIMPAR</button>
</div>

<div class="banner" id="banner">
<img id="bannerImg" src="https://img.youtube.com/vi/gaPE0HTgAP0/hqdefault.jpg">
<div class="banner-info">
<h1 id="bannerNome">Habeas Corpus</h1>
<button class="btn-assistir" onclick="playBanner()">▶ Assistir</button>
</div>
</div>

<div id="lista"></div>

<div id="player">
<button onclick="fechar()" style="position:absolute;top:10px;left:10px;background:#e50914;color:#fff;border:none;padding:9px 14px;border-radius:20px;z-index:10002;font-weight:800">↩ VOLTAR</button>
<button onclick="modoTV()" style="position:absolute;top:10px;right:10px;background:#007feb;color:#fff;border:none;padding:9px 14px;border-radius:20px;z-index:10002;font-weight:900">📺 TV</button>
<iframe id="frame" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<div class="bottom">
<div class="ativo" onclick="location.reload()"><div>🏠</div>Início</div>
<div onclick="document.getElementById('busca').focus()"><div>🎞️</div>Buscar</div>
<div onclick="modoTV()"><div>📺</div>TV</div>
<div onclick="salvarFixo()"><div>⬇️</div>Baixar</div>
<div onclick="abrirGanhos()"><div>👤</div>Meu menu</div>
</div>

<div id="modal"><div class="box" id="boxConteudo"></div></div>

<script>
let GENEROS=["Super Man","Turma da Mônica","Filmes","Doramas","Chaves","Looney Tunes","Séries","Anime","Ação","Marvel Universe","Best movies for kids"];
let filmesBase=[
{t:"Super Man 1",i:"https://img.youtube.com/vi/plaU0sa1MQ8/hqdefault.jpg",l:"https://www.youtube.com/embed/plaU0sa1MQ8",pasta:"Super Man"},
{t:"Super Man 2",i:"https://img.youtube.com/vi/Rw3Tv8WAd1w/hqdefault.jpg",l:"https://www.youtube.com/embed/Rw3Tv8WAd1w",pasta:"Super Man"},
{t:"Turma da Mônica 1",i:"https://img.youtube.com/vi/BbYLSzrUAwY/hqdefault.jpg",l:"https://www.youtube.com/embed/BbYLSzrUAwY",pasta:"Turma da Mônica"},
{t:"Chaves 1",i:"https://img.youtube.com/vi/NdQn3sOGAB4/hqdefault.jpg",l:"https://www.youtube.com/embed/NdQn3sOGAB4",pasta:"Chaves"},
{t:"Doramas 1",i:"https://img.youtube.com/vi/gaPE0HTgAP0/hqdefault.jpg",l:"https://www.youtube.com/embed/gaPE0HTgAP0",pasta:"Doramas"},
{t:"Coven Academy",i:"https://img.youtube.com/vi/CuJ1xMVqY0I/hqdefault.jpg",l:"https://www.youtube.com/embed/CuJ1xMVqY0I",pasta:"Latest Featured Series"},
{t:"Avengers Endgame",i:"https://img.youtube.com/vi/g-Nyi9dOy6E/hqdefault.jpg",l:"https://www.youtube.com/embed/g-Nyi9dOy6E",pasta:"Marvel Universe"},
{t:"Avengers Infinity War",i:"https://img.youtube.com/vi/nul6lTbu3oA/hqdefault.jpg",l:"https://www.youtube.com/embed/nul6lTbu3oA",pasta:"Marvel Universe"}
];
let extras=JSON.parse(localStorage.getItem('grati_extras')||'[]');
let filmes=[...filmesBase,...extras];
let bannerIdx=0;
function getID(u){u=u.trim();let id='';if(u.includes('youtu.be/'))id=u.split('youtu.be/')[1];else if(u.includes('v='))id=u.split('v=')[1];else if(u.includes('embed/'))id=u.split('embed/')[1];else id=u;return id.split('?')[0].split('&')[0].split('/')[0].substring(0,11);}
function render(filtroLista=null){
let listaRender = filtroLista || filmes;
if(listaRender.length){bannerIdx=filmes.indexOf(listaRender[0]);document.getElementById('bannerImg').src=listaRender[0].i;document.getElementById('bannerNome').innerText=listaRender[0].t;}
let c=document.getElementById('lista');c.innerHTML='';
let todos=[...new Set([...GENEROS,...listaRender.map(f=>f.pasta)])];
todos.forEach(g=>{
let lista=listaRender.filter(f=>f.pasta===g);if(!lista.length)return;
let h=`<div class="row-title"><span>${g}</span><span style="color:#555"> > </span></div><div class="row">`;
lista.forEach(f=>{
let idx=filmes.indexOf(f);
let nota=(8+Math.random()*1).toFixed(1);
h+=`<div class="card"><div class="tag">DUB FHD</div><div class="nota">${nota}</div><img src="${f.i}" onclick="play(${idx})"><div class="titulo">${f.t}</div><div class="botoes"><span onclick="editar(${idx})">✏️</span><span onclick="compartilhar(${idx})">📤</span><span onclick="del(${idx})">🗑️</span></div></div>`;
});h+=`</div>`;c.innerHTML+=h;
});
}
function play(i){document.getElementById('player').style.display='block';let base=filmes[i].l.replace('youtube-nocookie.com','www.youtube.com');document.getElementById('frame').src=base+'?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1';}
function playBanner(){play(bannerIdx);}
function fechar(){document.getElementById('player').style.display='none';document.getElementById('frame').src='';}
function modoTV(){
const f=document.getElementById('frame');if(!f.src)return alert('Abra um filme primeiro!');
let escolha=confirm('📺 COMO QUER VER?\n\nOK = TV SMART (Samsung/LG)\nCANCELAR = TV BOX');
if(escolha){alert('📺 TV SMART:\n1. Arraste de cima pra baixo\n2. Clique Smart View / Transmitir\n3. Escolha sua TV');}
else{alert('📺 TV BOX:\nSeu site já está na TV Box!\nDigite na TV Box:\nbancogratidao.com.br');}
}
function filtrar(){let q=document.getElementById('busca').value.toLowerCase();if(!q){render();return;}render(filmes.filter(x=>x.t.toLowerCase().includes(q)));}
function filtrarCategoria(cat){if(!cat){render();return;}render(filmes.filter(f=>f.pasta.toLowerCase().includes(cat.toLowerCase())||f.t.toLowerCase().includes(cat.toLowerCase())));}
function editar(i){let n=prompt('✏️ Mudar nome:',filmes[i].t);if(n&&n.trim()){filmes[i].t=n.trim();extras=filmes.filter(f=>!filmesBase.find(b=>b.l===f.l));localStorage.setItem('grati_extras',JSON.stringify(extras));render();}}
function del(i){if(confirm('🗑️ Apagar "'+filmes[i].t+'"?')){filmes.splice(i,1);extras=filmes.filter(f=>!filmesBase.find(b=>b.l===f.l));localStorage.setItem('grati_extras',JSON.stringify(extras));render();}}
function compartilhar(i){let link=filmes[i].l;if(navigator.share){navigator.share({title:filmes[i].t,url:link});}else{navigator.clipboard.writeText(link);alert('📤 Copiado: '+link);}}
function compartilharSite(){if(navigator.share){navigator.share({title:'GRATIFLIX',url:location.href});}else{prompt('Copie:',location.href);}}
function convidar(){let msg=`👋 Entra no meu GRATIFLIX - Filmes grátis igual Nuvix!\n${location.href}`;if(navigator.share){navigator.share({title:'Convite',text:msg,url:location.href});}else{prompt('👥 Copie e envie:',msg);}}
function addYT(){let link=prompt('Cole link YouTube:');if(!link)return;let id=getID(link);let nome=prompt('Nome:')||'Filme';let pasta=prompt('Pasta? (ex: Marvel Universe)')||'Geral';let obj={t:nome,i:`https://img.youtube.com/vi/${id}/hqdefault.jpg`,l:`https://www.youtube.com/embed/${id}`,pasta:pasta};filmes.push(obj);extras.push(obj);localStorage.setItem('grati_extras',JSON.stringify(extras));render();}
function addPasta(){let n=prompt('Nome da pasta?');if(n){GENEROS.push(n);render();}}
function abrirArquivo(){document.getElementById('modal').style.display='flex';document.getElementById('boxConteudo').innerHTML=`<h2>📁 ARQUIVO</h2><input id="pBonito" placeholder="Nome da pasta"><textarea id="pLinks" placeholder="Cole links, um por linha"></textarea><div style="display:flex;gap:6px"><button style="flex:1;padding:10px;background:#333;color:#fff;border:none;border-radius:8px" onclick="fecharModal()">Cancelar</button><button style="flex:1;padding:10px;background:#f5c518;color:#000;border:none;border-radius:8px;font-weight:900" onclick="gerarTemp()">GERAR</button></div><div id="resTemp" style="display:none;margin-top:10px"><textarea id="codTemp" style="height:120px;background:#000;color:#0f0"></textarea><button style="width:100%;padding:10px;background:#00c851;color:#fff;border:none;border-radius:8px;margin-top:6px" onclick="addTemp()">Adicionar</button></div>`;}
let temp=[];function gerarTemp(){let bonito=document.getElementById('pBonito').value.trim()||'Geral';let linhas=document.getElementById('pLinks').value.trim().split('\n');temp=[];let cod='';linhas.forEach((ln,i)=>{let id=getID(ln);if(id.length>=10){let o={t:`${bonito} ${i+1}`,i:`https://img.youtube.com/vi/${id}/hqdefault.jpg`,l:`https://www.youtube.com/embed/${id}`,pasta:bonito};temp.push(o);cod+=`{t:"${bonito} ${i+1}",i:"https://img.youtube.com/vi/${id}/hqdefault.jpg",l:"https://www.youtube.com/embed/${id}",pasta:"${bonito}"},\n`;}});document.getElementById('codTemp').value=cod;document.getElementById('resTemp').style.display='block';}
function addTemp(){if(temp.length){filmes=filmes.concat(temp);extras=extras.concat(temp);localStorage.setItem('grati_extras',JSON.stringify(extras));render();fecharModal();temp=[];}}
function fecharModal(){document.getElementById('modal').style.display='none';}
function salvarFixo(){let txt='let filmesBase=[\n';filmes.forEach(f=>{txt+=`{t:"${f.t}",i:"${f.i}",l:"${f.l}",pasta:"${f.pasta}"},\n`;});txt+='];';document.getElementById('modal').style.display='flex';document.getElementById('boxConteudo').innerHTML=`<h2>💾 SALVAR FIXO - COPIE E COLE NO CÓDIGO</h2><textarea style="height:300px;background:#000;color:#0f0;font-size:10px">${txt}</textarea><button style="width:100%;padding:10px;background:#e50914;color:#fff;border:none;border-radius:8px;margin-top:8px" onclick="fecharModal()">Fechar</button>`;}
function abrirGanhos(){document.getElementById('modal').style.display='flex';document.getElementById('boxConteudo').innerHTML=`
<div style="text-align:center">
<h2 style="color:#f5c518">Ganhe Dinheiro Convidando</h2>
<p style="margin:10px 0;color:#aaa">Igual ao da sua foto do Nuvix</p>
<div style="background:#0f1115;border:1px solid #f5c518;border-radius:12px;padding:20px;margin:15px 0">
<h3>Compartilhar o APP</h3>
<p style="margin:15px 0">Novos usuários receberão</p>
<h1 style="color:#f5c518;font-size:36px">R$ 2,69</h1>
<p>após o login</p>
<button onclick="convidar()" style="width:100%;margin-top:15px;padding:14px;background:linear-gradient(#ffb84d,#ff4d00);border:none;border-radius:30px;font-weight:900;color:#fff">Login / Cadastro</button>
</div>
<p style="font-size:11px;color:#666">Seu link: ${location.href}</p>
<button onclick="fecharModal()" style="margin-top:10px;padding:8px 20px;background:#333;color:#fff;border:none;border-radius:20px">Fechar</button>
</div>`;}
render();
</script>
</body>
</html>
